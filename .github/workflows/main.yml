name: CI
on:
  workflow_dispatch: #allows repo admins to trigger this workflow from the Actions tab
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/main.yml'
      - 'docs/**'
      - '*.md'
      - '.git*'

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test-nbdev-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          # Install released fastcore/nbdev wheels from PyPI. Building the
          # git @main/@master sources from source currently fails because
          # nbdev's newer project.license metadata is rejected by the pinned
          # setuptools during source metadata generation. Prebuilt wheels skip
          # that build step and install cleanly.
          pip install nbdev fastcore
          pip install --no-deps -e .
      - name: Check nbdev sync
        run: |
          python -m nbdev.export
          if [[ `git status --porcelain -uno` ]]; then
            echo "::error::Notebooks and library are not in sync. Please run nbdev_export."
            git status -uno
            git diff
            exit 1
          fi
