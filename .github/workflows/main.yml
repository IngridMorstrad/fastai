name: CI
on:
  workflow_dispatch: #allows repo admins to trigger this workflow from the Actions tab
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/main.yml'
      - 'docs/**'
      - '*.md'
      - '.git*'

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test-nbdev-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install "setuptools<72" wheel
          pip install --no-build-isolation git+https://github.com/fastai/fastcore.git@master
          pip install --no-build-isolation git+https://github.com/fastai/nbdev.git@a31e95986605  # pinned: nbdev main requires execnb>=0.3.2 which is not yet on PyPI (2026-08-10)
          pip install --no-deps -e .
      - name: Check nbdev sync
        run: |
          python -m nbdev.export
          if [[ `git status --porcelain -uno` ]]; then
            echo "::error::Notebooks and library are not in sync. Please run nbdev_export."
            git status -uno
            git diff
            exit 1
          fi
