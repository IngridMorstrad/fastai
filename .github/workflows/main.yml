name: CI
on:
  workflow_dispatch: #allows repo admins to trigger this workflow from the Actions tab
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/main.yml'
      - 'docs/**'
      - '*.md'
      - '.git*'

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test-nbdev-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install "setuptools<72" wheel
          pip install --no-build-isolation git+https://github.com/fastai/fastcore.git@master
          # Pin nbdev to a known-good commit instead of the moving @main branch.
          # nbdev@main (a336173c) switched project.license to the SPDX string form
          # ("Apache-2.0") and bumped build requires to setuptools>=77, which the
          # pinned "setuptools<72" here rejects (project.license must match exactly
          # one definition). This commit (nbdev 3.3.21) is the last one using the
          # table form {text = "Apache-2.0"} and builds cleanly under setuptools<72.
          # The sync gate below is unchanged and still verifies notebook/library sync.
          pip install --no-build-isolation git+https://github.com/fastai/nbdev.git@f9369273b96d5cccfc0e607d0cc083419922fce4
          pip install --no-deps -e .
      - name: Check nbdev sync
        run: |
          python -m nbdev.export
          if [[ `git status --porcelain -uno` ]]; then
            echo "::error::Notebooks and library are not in sync. Please run nbdev_export."
            git status -uno
            git diff
            exit 1
          fi
