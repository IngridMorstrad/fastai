name: CI
on:
  workflow_dispatch: #allows repo admins to trigger this workflow from the Actions tab
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/main.yml'
      - 'docs/**'
      - '*.md'
      - '.git*'

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test-nbdev-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          # The --no-build-isolation builds below compile fastcore@master and
          # nbdev@main against THIS env's setuptools, so it must satisfy both at once:
          #   * nbdev@main's pyproject.toml uses the PEP 639 SPDX form
          #     `license = "Apache-2.0"` and declares `requires = ["setuptools>=77"]`.
          #     SPDX license strings are only accepted by setuptools>=77; older
          #     setuptools rejects it with:
          #       ValueError: invalid pyproject.toml config: `project.license`.
          #   * fastcore@master uses a classic setup.py that imports `pkg_resources`,
          #     which setuptools removed in >=81, failing with:
          #       ModuleNotFoundError: No module named 'pkg_resources'.
          # The intersection is setuptools [77, 81). We pin that window and drop `-U`
          # (which previously pulled setuptools 84.x and broke fastcore).
          pip install "setuptools>=77,<81" wheel
          pip install --no-build-isolation git+https://github.com/fastai/fastcore.git@master
          pip install --no-build-isolation git+https://github.com/fastai/nbdev.git@main
          pip install --no-deps -e .
      - name: Check nbdev sync
        run: |
          python -m nbdev.export
          if [[ `git status --porcelain -uno` ]]; then
            echo "::error::Notebooks and library are not in sync. Please run nbdev_export."
            git status -uno
            git diff
            exit 1
          fi
