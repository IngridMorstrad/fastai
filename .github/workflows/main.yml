name: CI
on:
  workflow_dispatch: #allows repo admins to trigger this workflow from the Actions tab
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - '!.github/workflows/main.yml'
      - 'docs/**'
      - '*.md'
      - '.git*'

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test-nbdev-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install "setuptools<72" wheel
          pip install --no-build-isolation git+https://github.com/fastai/fastcore.git@master
          pip install --no-build-isolation git+https://github.com/fastai/nbdev.git@main
          pip install --no-deps -e .
      - name: Check nbdev sync
        run: |
          python -m nbdev.export
          if [[ `git status --porcelain -uno` ]]; then
            echo "::error::Notebooks and library are not in sync. Please run nbdev_export."
            git status -uno
            git diff
            exit 1
          fi

  test-notebooks:
    needs: test-nbdev-sync
    runs-on: ubuntu-latest
    env:
      download: "true"
      caching: "true"
    strategy:
      fail-fast: false
      matrix:
        py:  ["3.10", "3.11", "3.12"]
        nb_dec : ['[0-2]','[3-5]','[6-9]']
        nb_unit: ['[0-2]','[3-5]','[6-9]']
    steps:
    - name: checkout contents of PR
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.py }}
        cache: "pip"
        cache-dependency-path: settings.ini

    - name: Install libraries
      run: |
        pip install "setuptools<72" wheel
        pip install --no-build-isolation git+https://github.com/fastai/fastcore.git@master
        pip install --no-build-isolation git+https://github.com/fastai/nbdev.git@main
        pip install -Uq fastprogress
        pip install -Uqe .[dev] --extra-index-url https://download.pytorch.org/whl/cpu

    - name: check for cache hit
      uses: actions/cache@v4
      if: env.caching == 'true'
      id: cache
      with:
        path: ~/.fastai/data
        key: 'fastai-test-data-v3'

    - name: download data
      if: env.download == 'true' && steps.cache.outputs.cache-hit != 'true'
      run: |
        wget https://raw.githubusercontent.com/fastai/docker-containers/master/fastai/tmp_scripts/download_testdata.py
        ipython download_testdata.py
        mkdir -p $HOME/.fastai/data
        find $HOME/.fastai/archive/ -name "*.tgz" -exec tar -xzvf {} -C $HOME/.fastai/data \;
    - name: Migrate settings.ini to pyproject.toml for nbdev 3.x compatibility
      run: |
        if [ -f settings.ini ]; then
          nbdev-migrate-config
        fi

    - name: Test notebooks batch ${{matrix.nb_dec}}${{matrix.nb_unit}}
      run: python -m nbdev.test --flags '' --n_workers 3 --pause 1.0 --file_re "${{matrix.nb_dec}}${{matrix.nb_unit}}.*"

